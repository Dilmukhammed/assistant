<html lang="ru">
<head>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="top-nav">
        <div class="nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.477 2 2 6.477 2 12C2 17.523 6.477 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2ZM10.5 17.5V14.5C10.5 13.948 10.948 13.5 11.5 13.5H12.5C13.052 13.5 13.5 13.948 13.5 14.5V17.5H16.5V12C16.5 11.448 16.052 11 15.5 11H14.5V9.5C14.5 8.948 14.052 8.5 13.5 8.5H10.5C9.948 8.5 9.5 8.948 9.5 9.5V11H8.5C7.948 11 7.5 11.448 7.5 12V17.5H10.5Z" fill="#a4a4a4"/>

        <div class="nav-icons-right">
            <div class="nav-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6H20M4 12H20M4 18H20" stroke="#a4a4a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="center-container">
            <div class="logo-container">
                <svg class="logo-icon" width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20.94 13.08C20.48 14.83 19.33 16.33 17.8 17.29C16.27 18.25 14.43 18.5 12.69 18.06C10.95 17.62 9.43 16.54 8.44 15.05C7.45 13.56 7.07 11.77 7.37 10.02C7.67 8.27 8.64 6.69 10.08 5.58C11.52 4.47 13.31 3.94 15.08 4.1C16.85 4.26 18.47 5.1 19.68 6.45" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

                </svg>
                <h1 class="logo-text">OpenAI</h1>
            </div>

            <div class="filter-pills">
                <button class="pill">News</button>
                <button class="pill">Videos</button>
                <button class="pill">Books</button>
                <button class="pill">Images</button>
            </div>

            <div class="search-bar">
                <div class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                       <path d="M20.94 13.08C20.48 14.83 19.33 16.33 17.8 17.29C16.27 18.25 14.43 18.5 12.69 18.06C10.95 17.62 9.43 16.54 8.44 15.05C7.45 13.56 7.07 11.77 7.37 10.02C7.67 8.27 8.64 6.69 10.08 5.58C11.52 4.47 13.31 3.94 15.08 4.1C16.85 4.26 18.47 5.1 19.68 6.45" stroke="#a4a4a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                       <path d="M3.06 10.92C3.52 9.17 4.67 7.67 6.2 6.71C7.73 5.75 9.57 5.5 11.31 5.94C13.05 6.38 14.57 7.46 15.56 8.95C16.55 10.44 16.93 12.23 16.63 13.98C16.33 15.73 15.36 17.31 13.92 18.42C12.48 19.53 10.69 20.06 8.92 19.9C7.15 19.74 5.53 18.9 4.32 17.55" stroke="#a4a4a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <input type="text" placeholder="What is the benefit of using an AI-powered design expert?">
                <div class="mic-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <path d="M12 19v4"/>
                    </svg>
                </div>
            </div>
        </div>
    </main>

</html>
